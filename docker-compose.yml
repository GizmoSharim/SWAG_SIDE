services:
  postgres:
    image: postgres:16-alpine
    container_name: swag-side-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swag_side
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swag_side"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: swag-side-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/swag_side?schema=public
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      JWT_ACCESS_SECRET: change-this-access-secret
      JWT_REFRESH_SECRET: change-this-refresh-secret
      COOKIE_SECURE: "false"
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
    ports:
      - "3333:3333"
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  frontend:
    build:
      context: ./swag-side-admin
    container_name: swag-side-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
